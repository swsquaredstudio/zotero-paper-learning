<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul" xmlns:html="http://www.w3.org/1999/xhtml" id="ivar-paper-learning-window" title="Paper Learning" width="700" height="680" orient="vertical">
<script type="application/javascript" src="chrome://ivar-paper-learning/content/dialog.js"/>
<html:style>
#ivar-paper-learning-window{display:flex;flex-direction:column}.content{font:15px sans-serif;padding:24px;overflow:auto;flex:1;color:#172235;background:#f6f8fc}label{display:block;margin:12px 0}select,input,button{font:inherit;padding:8px}button{margin:10px 8px 0 0}p{line-height:1.5}.note{padding:8px;border-bottom:1px solid #ccd3df}small{display:block;color:#44546a}#notes{max-height:230px;overflow:auto}fieldset{margin-top:20px} [hidden]{display:none!important}
</html:style>
<html:div class="content">
<html:h2 id="heading">Paper Learning</html:h2><html:p id="paper"/><html:p id="description"/>
<html:div id="notes"/>
<html:p id="status" role="status">Loading…</html:p>
<html:button id="primary" disabled="disabled">Continue</html:button><html:button id="cancel">Cancel</html:button>
<html:fieldset id="create" hidden="hidden"><html:legend>Create a new learning note</html:legend>
<html:label>Task <html:select id="kind"><html:option value="summary">Rough summary</html:option><html:option value="translation">Detailed translation</html:option></html:select></html:label>
<html:label>Scope <html:select id="scope"><html:option value="whole">Whole paper</html:option><html:option value="section">Section</html:option></html:select></html:label>
<html:label>Section <html:input id="section" disabled="disabled" placeholder="Introduction, Methods, etc."/></html:label>
<html:button id="new">Create and open note</html:button><html:small>Existing notes will not be overwritten. Notes use Zotero's normal saving and sync settings.</html:small>
</html:fieldset>
<html:small>Drafts live in Zotero notes, not in this dialog. Cancelling an export does not delete them.</html:small>
</html:div></window>
